.tile{background:var(--surface);border:0;border-radius:var(--rc);padding:10px 12px 10px 10px;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:6px 8px;align-items:center;color:var(--ink)}
.tile .ti{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--tc)}
.tile .tn{justify-self:end;font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .tl{grid-column:1/-1;font-size:15px;font-weight:600;color:var(--muted)}

.tile[aria-pressed="true"] .tl{color:#fff}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto}

.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);font-style:normal;font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="cloud"]::before{background:var(--ok)}
.sync[data-s="err"]::before{background:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin;align-items:center}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:6px 12px 6px 10px;font-size:14px;max-width:240px}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip[aria-current="true"] .n{color:inherit;opacity:.7}
.chip.mapchip{font-weight:600;padding-left:12px}
.chip.add{border-style:dashed;color:var(--muted);background:transparent}
.navsep{flex:none;width:1px;height:22px;background:var(--line)}

.phead{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:end;padding-block:8px 14px;border-bottom:1px solid var(--line)}
.pname{min-width:0;width:100%;border:0;background:transparent;font-family:var(--f-display);font-weight:var(--dw);font-size:clamp(20px,4.6vw,30px);line-height:1.15;padding:2px 0;border-radius:6px;margin:0}
input.pname:hover{background:var(--sunk)}
.pmeta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap;grid-column:1/-1}
.bar{flex:1;min-width:120px;max-width:320px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tabs{display:inline-flex;background:var(--sunk);border-radius:var(--rs);padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:500;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ghost{border:1px solid transparent;background:transparent;border-radius:var(--rs);padding:6px 10px;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:5px}
.ghost:hover{background:var(--sunk);color:var(--ink)}
.danger{color:var(--bad)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:10px 16px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:var(--sunk);color:var(--ink)}

/* task list */
.add-task{display:flex;gap:8px;margin-block:16px}

.trow{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:hover{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.ck{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.8px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:var(--surface)}
.ck:hover{border-color:var(--ok)}
.ck.doing{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.ck.done{border-color:var(--ok);background:var(--ok)}
.tbody{flex:1;min-width:0}
.ttl{font-weight:500;overflow-wrap:anywhere}
.trow.done .ttl{color:var(--muted);text-decoration:line-through}
.tmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:3px}
.tmeta:empty{display:none}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px}
.pill.doing{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.prio{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;letter-spacing:.02em}
.prio.high{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.prio.low{background:var(--sunk);color:var(--muted)}
.due{font-family:var(--f-mono);font-size:11px}
.due.late{color:var(--bad);font-weight:600}
.linkmark{display:inline-flex;align-items:center;gap:3px}
.tempty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
details.donebox{margin-top:14px}
details.donebox summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 2px;list-style:none;display:flex;gap:6px;align-items:center}
details.donebox summary::-webkit-details-marker{display:none}
details.donebox summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:16px}
details.donebox[open] summary::before{transform:rotate(90deg)}
details.donebox .tlist{margin-top:6px}

/* map shell */
.mapbox{position:relative;margin-top:14px;height:max(420px,calc(var(--paneh,100dvh) - 230px));background:var(--g-bg);border:1px solid var(--line);border-radius:var(--rc);overflow:hidden}

.mapbox .grab{cursor:grabbing}
.mapbox canvas.pt{cursor:pointer}
.mtop{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:2}
.mtop>*{pointer-events:auto}
.mhint{font-size:12px;color:var(--muted);background:var(--surface);padding:4px 8px;border-radius:7px;border:1px solid var(--line)}
.gsearch{flex:0 1 220px;min-width:110px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:7px 10px;font-size:14px}
.gbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);height:34px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.gbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.gbtn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.gbtn.ico{width:34px;padding:0;justify-content:center}
.mtools{position:absolute;right:10px;top:54px;display:flex;flex-direction:column;gap:6px;z-index:2}
.gcount{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.gset{position:absolute;top:52px;right:10px;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 28px rgba(10,20,30,.18);z-index:3}
.gset label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.gset label.ckl{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.gset input[type=range]{width:100%;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* tree */
.node{cursor:pointer}
.node text{font-family:var(--f-body);font-size:14px;font-weight:500;fill:var(--ink);dominant-baseline:central;pointer-events:none}
.node text .st{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.node.root text{font-family:var(--f-display);font-size:15px;fill:var(--bg)}
.node rect.box{fill:var(--surface);stroke-width:1.5}

.node.sel rect.ring{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:4 3}
.edge{fill:none;stroke-width:2;stroke-linecap:round}
.tog{cursor:pointer}
.tog circle{fill:var(--surface);stroke-width:1.5}
.tog text{font-family:var(--f-mono);font-size:10px;dominant-baseline:central;text-anchor:middle;pointer-events:none}
.mbar{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;box-shadow:0 6px 24px rgba(10,20,30,.14);z-index:2}

.mbar input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:var(--rs);padding:8px 10px}
.mbar button{border:1px solid var(--line);background:var(--bg);border-radius:var(--rs);padding:7px 10px;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.mbar button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.auth-p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.auth-f{display:flex;flex-direction:column;gap:8px}
.auth-f label{font-size:12px;color:var(--muted);font-weight:600}
.auth-f input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--rs);padding:12px 14px;font-size:16px}
.auth-pw{display:flex;gap:6px;align-items:center}.auth-pw input{flex:1;min-width:0}.auth-pw .ghost{flex:none}
.auth-f .btn{justify-content:center;padding:12px 16px;font-size:15px;margin-top:4px}
.auth-f .btn:disabled{opacity:.6}
.auth-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.auth-err{margin:0;min-height:1.2em;font-size:13px;color:var(--bad)}
.auth-skip{align-self:center;font-size:12.5px}
.acct{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.acct-mail{font-size:12px;color:var(--muted);padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- shell: left toolbar + workspace ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-right:1px solid var(--line);
  padding:14px 10px 12px max(10px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:15}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px}
.side-x{display:none}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.sn-sec{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sn-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;font-size:14px;font-weight:500;padding:8px 10px;border-radius:var(--rs);text-decoration:none;cursor:pointer}
.sn-item svg{flex:none;color:var(--muted)}
.sn-item span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-item em,.sn-proj em{font-style:normal;font-size:11px;color:var(--muted)}
.sn-item:hover,.sn-proj:hover{background:var(--sunk)}
.sn-item[aria-current="page"],.sn-proj[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.sn-item[aria-current="page"] svg{color:var(--accent)}
.sn-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sn-add{border:0;background:transparent;color:var(--muted);width:26px;height:26px;border-radius:var(--rs);display:grid;place-items:center;padding:0}
.sn-add:hover{background:var(--sunk);color:var(--accent)}
.gset .gstyle{flex:none;align-self:flex-start}.gset .gstyle button{padding:5px 12px;height:auto;font-size:12.5px}
.sn-root{gap:2px;margin-top:8px}
.sn-chev{flex:none;width:20px;height:22px;margin-left:-8px;border:0;background:transparent;color:var(--muted);border-radius:5px;display:grid;place-items:center;padding:0}
.sn-chev:hover{background:var(--sunk);color:var(--ink)}.sn-chev svg{width:12px;height:12px;transition:transform .15s}
.sn-chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.sn-rc{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:0;padding-right:4px}.sn-root:first-child{margin-top:0}
.sn-rname{flex:1;min-width:0;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;letter-spacing:inherit;text-transform:uppercase;padding:3px 4px;margin-left:-5px;border-radius:5px;text-overflow:ellipsis}
.sn-rname:hover{border-color:var(--line)}.sn-rname:focus{outline:none;border-color:var(--accent);color:var(--ink);text-transform:none;letter-spacing:0;background:var(--bg)}
.sn-delroot{opacity:0}.sn-root:hover .sn-delroot,.sn-delroot:focus-visible{opacity:1}@media (hover:none){.sn-delroot{opacity:.7}}
.sn-delroot svg{width:13px;height:13px}
.sn-empty{padding:4px 10px 6px;font-size:12px}
.sn-newroot{display:flex;align-items:center;gap:8px;margin:10px 4px 4px;padding:7px 10px;border:1px dashed var(--line);border-radius:var(--rs);background:transparent;color:var(--muted);font-size:12.5px}
.sn-newroot:hover{color:var(--ink);border-color:var(--muted)}.sn-newroot svg{width:13px;height:13px}
.nl-rh{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.nl-rh:not(:first-child){border-top:1px solid var(--line);margin-top:0}
.nl-rh .t{font-family:var(--f-display);font-weight:var(--dw);font-size:14px;letter-spacing:.02em;text-transform:uppercase}
.nl-rh .num{font-size:12px;color:var(--muted)}.nl-rh .ghost{margin-left:auto;font-size:12.5px;padding:4px 8px}
.nl-rempty{padding:12px 16px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}
.pacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proot{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--rs);padding:0 4px 0 9px;color:var(--muted);background:var(--surface)}
.proot select{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:7px 4px}
.sn-list{display:flex;flex-direction:column;gap:1px;overflow-y:auto;min-height:0;flex:1}
.sn-proj{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;font-size:14px;padding:6px 10px 6px calc(10px + var(--d,0) * 16px);border-radius:var(--rs);cursor:pointer}
.sn-proj .dot{width:9px;height:9px;border-radius:50%;flex:none}
.sn-proj .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-bottom{display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line);padding-top:8px}
.side-bottom .sync{margin:6px 10px 0;font-size:11.5px}
.side-bottom #fsBtn[hidden]{display:none}
.work{min-width:0;padding-left:max(20px,env(safe-area-inset-right,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:6px 32px}
.work #main{max-width:1400px;margin:0 auto}
.panes.split #main{max-width:none}
.mbar-top{display:none}
.side-scrim{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);height:auto;transform:translateX(-102%);transition:transform .2s ease;z-index:35;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .shell.navopen .side{transform:none}
  .shell.navopen + .side-scrim{display:block;position:fixed;inset:0;background:rgba(8,14,20,.4);z-index:34}
  .side-x{display:grid}
  .work{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mbar-top{display:flex;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--bg);padding:8px 0;margin-bottom:2px}
  .mbar-title{font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:13;background:var(--bg)}
}
/* tabs + split panes */
.work{display:flex;flex-direction:column;height:100dvh;padding-block:0!important;overflow:hidden}
.panes{flex:1;min-height:0;display:flex;flex-direction:column}
.panes.split.row{flex-direction:row}
.pane{position:relative;min-width:0;min-height:0;flex:1 1 50%;overflow:auto;padding-bottom:28px;overscroll-behavior:contain}
.panes:not(.split) .pane{flex:1 1 auto}
.panes.split .pane{flex-grow:0;flex-shrink:0}
.panes.split #pane1{flex:1 1 0;padding:0;overflow:hidden}
.pane iframe{border:0;width:100%;height:100%;display:block;background:var(--bg)}
.pdiv{flex:none;background:var(--line);position:relative;z-index:3}
.panes.row .pdiv{width:5px;cursor:col-resize;margin:0 2px}
.panes.col .pdiv{height:5px;cursor:row-resize;margin:2px 0}
.pdiv:hover,.pdiv:focus-visible{background:var(--accent);outline:none}
.panes.split .pane.focused{box-shadow:inset 0 2px 0 var(--accent)}
body.resizing{user-select:none}body.resizing iframe{pointer-events:none}
.tabbar{position:sticky;top:0;z-index:11;display:flex;align-items:flex-end;gap:8px;background:var(--bg);border-bottom:1px solid var(--line);padding-top:8px;margin-bottom:4px}
.tb-tabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tb-tabs::-webkit-scrollbar{display:none}
.tb-tab{flex:none;display:flex;align-items:center;gap:7px;max-width:220px;padding:7px 8px 7px 11px;border:1px solid transparent;border-bottom:0;border-radius:var(--rs) var(--rs) 0 0;color:var(--muted);font-size:13px;cursor:pointer;user-select:none;margin-bottom:-1px}
.tb-tab:hover{color:var(--ink);background:color-mix(in srgb,var(--sunk) 60%,transparent)}
.tb-tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:600}
.tb-tab svg{width:13px;height:13px;flex:none}.tb-tab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tb-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-x{flex:none;width:20px;height:20px;border:0;background:transparent;color:var(--muted);border-radius:5px;display:grid;place-items:center;padding:0;opacity:.6}
.tb-x svg{width:11px;height:11px}.tb-x:hover{opacity:1;background:var(--sunk);color:var(--ink)}
.tb-add{flex:none;width:28px;height:28px;margin:0 0 3px 2px;border:0;background:transparent;color:var(--muted);border-radius:var(--rs);display:grid;place-items:center;padding:0}
.tb-add:hover{background:var(--sunk);color:var(--ink)}
.tb-tools{flex:none;display:flex;gap:2px;padding-bottom:4px}
.tb-btn{width:30px;height:28px;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:var(--rs);display:grid;place-items:center;padding:0}
.tb-btn:hover{background:var(--sunk);color:var(--ink)}.tb-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--line)}
.tb-btn svg{width:15px;height:15px}
.in-pane .side,.in-pane .mbar-top,.in-pane .side-scrim{display:none!important}
.in-pane .shell{grid-template-columns:minmax(0,1fr)}
.in-pane .work{padding-left:14px!important;padding-right:14px!important}
.in-pane .auth{display:none!important}
/* шифрование */
.e2e-gen{display:flex;flex-direction:column;gap:8px}
.e2e-out{display:flex;align-items:center;gap:8px;border:1px dashed var(--accent);border-radius:var(--rs);padding:8px 10px}
.e2e-out code{flex:1;font-family:var(--f-mono);font-size:18px;letter-spacing:2px;color:var(--ink);word-break:break-all}
.e2e-ck{display:flex!important;gap:8px;align-items:flex-start;font-weight:400!important;font-size:13px!important;color:var(--ink)!important;line-height:1.4}
.e2e-ck input{margin-top:2px}
.sn-item.e2e-on svg{color:var(--ok)}.sn-item.e2e-off svg{color:var(--warn)}
/* project colour picker */
.sn-pw{display:flex;align-items:center;gap:0;padding-left:calc(var(--d,0) * 16px)}
.sn-pw .sn-proj{padding-left:10px;flex:1;min-width:0}
.sn-pw .sn-dot+.sn-proj{padding-left:6px}
.sn-dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid transparent;padding:0;margin-left:8px;cursor:pointer;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 15%,transparent)}
.sn-dot:hover,.sn-dot:focus-visible{box-shadow:0 0 0 2px var(--surface),0 0 0 4px currentColor;outline:none}
.sn-dot.big{width:18px;height:18px;margin:0 6px 0 0}
.sqb{border:0;padding:0;cursor:pointer}.sqb:hover{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--muted)}
.cpick{position:fixed;z-index:70;width:232px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}
.cpick-h{font-size:13px;font-weight:600}.cpick-h span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.cpick-g{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cpick-s{width:24px;height:24px;border-radius:50%;border:0;padding:0;cursor:pointer}
.cpick-s[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.cpick-s:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cpick-c{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.cpick-c input{width:40px;height:26px;border:1px solid var(--line);border-radius:6px;background:transparent;padding:0 2px;cursor:pointer}
:root{--memo:#4AA8F2}
/* tasks & notes rows in the Projects list, virtual leaves on the tree */
.nl-i{min-height:34px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:pointer;font-size:13px}
.nl-i .nl-name{gap:8px}
.nl-i .ck{width:16px;height:16px;border-width:1.6px;flex:none;margin:0;border-radius:4px}
.nl-tg svg+svg{margin-left:-2px}
.lgi{display:inline-flex;align-items:center;gap:5px}.lgi svg{width:12px;height:12px}.lgi.memo svg{color:var(--memo);width:14px;height:14px}
.gbtn svg+svg{margin-left:-3px}
.nl-i .t{color:color-mix(in srgb,var(--ink) 82%,var(--muted))}
.nl-pr{color:var(--bad);font-weight:700}
.nl-mi{color:var(--memo);display:inline-flex;flex:none}.nl-mi svg{width:17px;height:17px}
.nl-prev{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.nl-i .stp{font-size:11px;padding:1px 8px}
.nl-done .t{color:var(--muted);font-size:12px}
.nl-tg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:var(--rs);padding:5px 10px;font-size:12.5px}
.nl-tg[aria-pressed="true"]{color:var(--ink);background:var(--sunk);border-color:var(--sunk)}
.nl-tg svg{width:13px;height:13px}
.node.virt rect.box{stroke-dasharray:4 3;stroke-width:1.2;fill:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.node.virt text{font-size:13px;font-weight:400}
.edge.vedge{stroke-width:1.4;stroke-dasharray:4 4}
@media (max-width:760px){.nl-prev{display:none}.nl-i .nl-st{display:none}}
/* ---------- Projects: grouped list (style «Ночь») ---------- */
.nl-top{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.nl-h1{margin:0;font-family:var(--f-display);font-weight:var(--dw);font-size:18px}
.nl-seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:calc(var(--rs) + 2px);overflow-x:auto;max-width:100%}
.nl-seg button{border:0;border-radius:var(--rs);padding:4px 10px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
.nl-seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:600}
.nl-sum{margin-left:auto;font-size:12px;color:var(--muted)}
.nl-sum .late{color:var(--bad)}
.nl-top .btn{padding:7px 12px;font-size:13px}
.nl{margin-top:12px;border:1px solid var(--line);border-radius:var(--rc);overflow:hidden;background:var(--bg)}
.nl-row{display:grid;grid-template-columns:minmax(0,1fr) 116px 70px 84px 104px 34px;gap:0 12px;align-items:center;padding:0 10px 0 14px}
.nl-row.dn-row{grid-template-columns:minmax(0,1fr) minmax(0,220px) 84px 34px}
.dn .nl-i .t{color:var(--muted)}
.dn-p{min-width:0}.dn-d,.dn-n{text-align:right;justify-self:end;font-size:12px;color:var(--muted)}
.dn-n{grid-column:3}
.dn-sub{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:0;background:transparent;padding:2px 0;color:var(--muted);font-size:12px;cursor:pointer;min-width:0}
.dn-sub span.dot{width:7px;height:7px;border-radius:50%;flex:none}.dn-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dn-sub:hover{color:var(--ink)}
.dn-q{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--rs);padding:6px 10px;font-size:13px;min-width:0;width:220px;max-width:100%}
.nl-hd{height:32px;font-size:11px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface)}
.nl-hd .r,.nl-open,.nl-st{text-align:right;justify-self:end}
.nl-g{min-height:42px;background:var(--surface);border-bottom:1px solid var(--line);cursor:pointer}
.nl-s{min-height:38px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);cursor:pointer}
.nl-row:hover:not(.nl-hd){background:color-mix(in srgb,var(--sunk) 70%,var(--surface))}
.nl-row:hover .icodel{opacity:1}
.nl-name{display:flex;align-items:center;gap:9px;min-width:0}
.nl-name .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nl-g .nl-name .t{font-weight:700;font-size:14px}
.nl-s .nl-name .t{font-weight:500;color:color-mix(in srgb,var(--ink) 88%,var(--muted))}
.nl-chev{border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:5px;display:grid;place-items:center;padding:0;margin-left:-4px;flex:none}
.nl-chev svg{width:12px;height:12px;transition:transform .15s}
.nl-chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.nl-chev:hover{background:var(--sunk);color:var(--ink)}
.nl-name .sq{width:10px;height:10px;border-radius:3px;flex:none}
.nl-name .dot{width:7px;height:7px;border-radius:50%;flex:none}
.nl-tie{width:10px;height:12px;border-left:1px solid color-mix(in srgb,var(--muted) 45%,transparent);border-bottom:1px solid color-mix(in srgb,var(--muted) 45%,transparent);transform:translateY(-5px);flex:none}
.nl-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.nl-tag{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nl-tag svg{width:13px;height:13px;color:var(--memo)}
.nl-prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ring{flex:none}
.ring circle{fill:none;stroke-width:2.4}
.ring .rb{stroke:var(--line)}
.ring .rf{stroke:var(--accent);stroke-linecap:round}
.ring.done .rf{stroke:var(--ok)}
.ring.late .rf{stroke:var(--bad)}
.nl-open{font-size:12.5px}
.nl-due{font-size:12px;color:var(--muted);padding-left:12px}
.nl-hd span:nth-child(4){padding-left:12px}
.nl-due.late{color:var(--bad)}
.nst{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.nst.plain{border-color:transparent;padding-inline:0}
.nst.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.nst.late{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.nst.doing{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.nst.plain.done,.nst.plain.late,.nst.plain.doing{border-color:transparent}
.nl-x{justify-self:end;display:flex;gap:2px}
.nl-row{grid-template-columns:minmax(0,1fr) 116px 70px 84px 104px 58px}
.nl-x .arb{opacity:.0}.nl-row:hover .nl-x .arb,.nl-x .arb:focus-visible,.nl-x .arb[aria-pressed="true"]{opacity:.75}
@media (hover:none){.nl-x .arb{opacity:.75}}
.arch{filter:grayscale(1);opacity:.5}
.nl-group.arch .arch{filter:none;opacity:1}
.nl-group.arch{opacity:.5}
.nl-group.arch .nl-g .t{font-weight:500}
.nst.arch{color:var(--muted);border-color:var(--line)}

/* ---------- persistence: one doc per project + one "map" doc ----------
   Each written doc carries _t (time of the local change). A snapshot older than
   our latest local change is ignored, so late or stale refreshes never roll back edits. */
const LT={};            // id -> time of latest local change
const seenRemote=new Set();
let lastSaved=0;
const strip=o=>{const c=clone(o);delete c._t;return c};
const docData=id=>id==='map'?(S.map?{kind:'map',nodes:S.map}:null):S.projects[id];
function persist(id){
  LT[id]=Date.now();pendQ[id]=LT[id];savePendQ();

  const p=pend[id]||(pend[id]={t:0,waiting:false,busy:false,again:false});

async function flush(id){
  const p=pend[id];if(!p)return;clearTimeout(p.t);p.waiting=false;if(p.busy){p.again=true;return}p.busy=true;
  try{const d=docData(id);if(d){const body=clone(d);body._t=LT[id]||Date.now();await col.doc(id).set(body);seenRemote.add(id);if(id!=='map')synced.add(id);if(pendQ[id]&&pendQ[id]<=body._t){delete pendQ[id];savePendQ()}}else{await col.doc(id).delete();seenRemote.delete(id);synced.delete(id);delete pendQ[id];savePendQ()}cacheLocal();lastSaved=Date.now();p.busy=false;if(!p.again&&!anyPending())setSync('cloud')}
  catch(e){setSync(e&&e.locked?'locked':'err');p.busy=false;p.waiting=true;p.t=setTimeout(()=>flush(id),4000);return}
  p.busy=false;if(p.again){p.again=false;flush(id)}
}
function anyPending(){return Object.values(pend).some(p=>p.waiting||p.busy||p.again)}

function onSnap(qs){
  const seen=new Set();let changed=false,mapDoc=null;
  for(const d of qs.docs){seen.add(d.id);const data=d.data();if(!data)continue;
    if(d.id==='map'){mapDoc=data;continue}
    if(stale(d.id,data)){seenRemote.add(d.id);continue}
    seenRemote.add(d.id);synced.add(d.id);
    const nd=strip(data),cur=S.projects[d.id];if(!cur||JSON.stringify(cur)!==JSON.stringify(nd)){S.projects[d.id]=nd;changed=true}}

    firstSnap=false;
    for(const id of Object.keys(S.projects))if(!seen.has(id)){if(synced.has(id)&&!LT[id]){delete S.projects[id];synced.delete(id)}else persist(id)}
    if(mapDoc&&mapDoc.nodes&&mapDoc.nodes.root){if(!stale('map',mapDoc)||!S.map)S.map=clone(mapDoc.nodes);seenRemote.add('map')}else if(!S.map)S.map=newMap();
    changed=true;
    const m1=migrateOld(),m2=reconcile();if(m1||m2||!mapDoc)persist('map');
  }else{
    // a project disappears only if we had seen it in the cloud and haven't touched it for a minute
    for(const id of Object.keys(S.projects))if(!seen.has(id)&&seenRemote.has(id)&&!isPending(id)&&Date.now()-(LT[id]||0)>60000){delete S.projects[id];seenRemote.delete(id);synced.delete(id);changed=true}
    if(mapDoc&&mapDoc.nodes&&mapDoc.nodes.root&&!stale('map',mapDoc)&&JSON.stringify(mapDoc.nodes)!==JSON.stringify(S.map)){S.map=clone(mapDoc.nodes);changed=true}
    if(changed&&reconcile())persist('map');
  }
  if(!anyPending()){if(!lastSaved)lastSaved=Date.now();setSync('cloud')}
  if(changed){cacheLocal();if(S.screen!=='map'&&S.screen!=='projects'&&S.screen!=='done'&&!S.projects[S.screen]&&!isMemoScr(S.screen))S.screen='map';if(!S.map[S.sel])S.sel='root';renderSafe()}
}
/* ---------- облако: Supabase (вход по коду из письма, синхронизация, офлайн-очередь) ---------- */
const CFG=window.SHTAB_CONFIG||{};
let sb=null,sbUser=null,localOnly=false;
const PENDQ_K=LSK+'.pendQ';
let pendQ={};try{pendQ=JSON.parse(localStorage.getItem(PENDQ_K)||'{}')||{}}catch(e){pendQ={}}
function savePendQ(){lsSet(PENDQ_K,JSON.stringify(pendQ))}
/* ---------- сквозное шифрование: в облако уходит только шифротекст (AES-256-GCM, ключ из фразы через PBKDF2) ---------- */
const EK_K=LSK+'.ek',ITER=600000,LOCKED=Symbol('locked');
let KEY=null,CRYPT=null,cryptLock=false,colUid=null,cryptKnown=false;
const u8b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function deriveKey(phrase,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(phrase.normalize('NFC')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u8(salt),iterations:iter||ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function encWith(key,kid,obj){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return{enc:1,kid,iv:u8b64(iv),ct:u8b64(ct)}}
async function decWith(key,d){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(d.iv)},key,b64u8(d.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function storeKey(){try{const raw=await crypto.subtle.exportKey('raw',KEY.key);lsSet(EK_K,JSON.stringify({kid:KEY.kid,raw:u8b64(raw)}))}catch(e){}}
async function loadKey(kid){try{const o=JSON.parse(localStorage.getItem(EK_K)||'null');if(!o||o.kid!==kid)return null;return{kid,key:await crypto.subtle.importKey('raw',b64u8(o.raw),{name:'AES-GCM'},true,['encrypt','decrypt'])}}catch(e){return null}}
const e2eOn=()=>!!CRYPT;
const randPhrase=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*?+=';let r='';const b=rnd(32);for(let i=0;i<32&&r.length<8;i++)if(b[i]<Math.floor(256/A.length)*A.length)r+=A[b[i]%A.length];while(r.length<8)r+=A[rnd(1)[0]%A.length];return r};
async function decRow(data){if(!data||!data.enc)return data;if(!KEY||data.kid!==KEY.kid)return LOCKED;try{return await decWith(KEY.key,data)}catch(e){return LOCKED}}
async function rawSet(id,data){const {error}=await sb.from('docs').upsert({user_id:colUid,id,data,updated_at:new Date().toISOString()},{onConflict:'user_id,id'});if(error)throw error}
async function rawDel(id){const {error}=await sb.from('docs').delete().eq('user_id',colUid).eq('id',id);if(error)throw error}
function lockE2E(){KEY=null;cryptLock=true;setSync('locked');if(!PANE)showCrypt('unlock')}
async function onCryptDoc(c){CRYPT=c||null;cryptKnown=true;
  if(!CRYPT){if(KEY||localStorage.getItem(EK_K)){KEY=null;try{localStorage.removeItem(EK_K)}catch(e){}}cryptLock=false;renderAccount();return true}
  if(KEY&&KEY.kid===CRYPT.kid){cryptLock=false;renderAccount();return true}
  const k=await loadKey(CRYPT.kid);if(k){KEY=k;cryptLock=false;renderAccount();return true}
  lockE2E();renderAccount();return false}
// one collection of the signed-in user's documents, with the same surface the app already uses
function makeCol(uid){
  colUid=uid;const docs=new Map();let listeners=[],ch=null,legacy=new Set(),retry=0;
  const emit=()=>{if(cryptLock)return;const arr=[...docs.entries()].map(([id,data])=>({id,data:()=>data}));for(const l of listeners)l.next({docs:arr});
    if(KEY&&legacy.size){const ids=[...legacy];legacy.clear();setTimeout(()=>{for(const id of ids)if(id==='map'||S.projects[id])persist(id)},50)}};
  async function loadAll(){const {data,error}=await sb.from('docs').select('id,data');if(error)throw error;
    const cr=data.find(r=>r.id==='crypt');if(!(await onCryptDoc(cr&&cr.data)))return;
    const next=new Map();for(const r of data){if(r.id==='crypt')continue;const v=await decRow(r.data);
      if(v===LOCKED){clearTimeout(retry);retry=setTimeout(()=>loadAll().catch(()=>{}),3000);return}   // запись другим ключом — подождём, не трогая локальные данные
      if(CRYPT&&r.data&&!r.data.enc)legacy.add(r.id);next.set(r.id,v)}
    docs.clear();for(const [k,v] of next)docs.set(k,v);emit()}
  let seq=0;
  function subscribe(){if(ch)return;
    ch=sb.channel('docs-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'user_id=eq.'+uid},async pl=>{
      const my=++seq;
      if(pl.eventType==='DELETE'){const id=pl.old&&pl.old.id;if(id==='crypt'){await onCryptDoc(null);return}if(id&&docs.has(id)){docs.delete(id);emit()}}
      else if(pl.new&&pl.new.id){const id=pl.new.id;if(id==='crypt'){if(await onCryptDoc(pl.new.data))loadAll().catch(()=>{});return}
        const v=await decRow(pl.new.data);if(v===LOCKED){if(CRYPT&&(!KEY||KEY.kid!==CRYPT.kid))lockE2E();return}
        if(CRYPT&&pl.new.data&&!pl.new.data.enc)legacy.add(id);docs.set(id,v);emit()}
    }).subscribe(st=>{if(st==='SUBSCRIBED')loadAll().catch(()=>{});if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){setSync('err')}})}
  return{
    doc:id=>({
      set:async body=>{if(CRYPT&&!KEY){const e=new Error('locked');e.locked=true;throw e}
        const data=KEY?await encWith(KEY.key,KEY.kid,body):body;
        const {error}=await sb.from('docs').upsert({user_id:uid,id,data,updated_at:new Date().toISOString()},{onConflict:'user_id,id'});if(error)throw error;docs.set(id,body)},
      delete:async()=>{const {error}=await sb.from('docs').delete().eq('user_id',uid).eq('id',id);if(error)throw error;docs.delete(id)}}),
    onSnapshot(next,err){const l={next};listeners.push(l);loadAll().then(subscribe).catch(e=>{listeners=listeners.filter(x=>x!==l);err&&err(e)});return()=>{listeners=listeners.filter(x=>x!==l)}},
    refresh(){return loadAll().catch(()=>{})},
    close(){try{if(ch)sb.removeChannel(ch)}catch(e){}ch=null;listeners=[]}
  };
}
function fileSaver(){return{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:'saved'}}}}
async function initStore(){
  dl=fileSaver();

function migrateOld(){
  let ch=false;const L=s=>[...(s||'').matchAll(/\[\[([^\]\|#\n]+)/g)].map(m=>m[1]);
  for(const [pid,p] of sortedProjects()){
    if(p.map&&p.map.root){
      const m=p.map,ids={};for(const k in m)ids[k]='n'+uid();
      for(const k in m){const n=m[k];const nn={text:n.text||'',children:(n.children||[]).filter(c=>m[c]).map(c=>ids[c])};if(n.collapsed)nn.collapsed=true;
        if(n.taskId){const t=p.tasks.find(x=>x.id===n.taskId);if(t){nn.taskId=t.id;nn.taskPid=pid;t.nodeId=ids[k]}}S.map[ids[k]]=nn}
      const top=S.map[ids.root];top.text=p.name;top.project=pid;top.side=pickSide();S.map.root.children.push(ids.root);
      delete p.map;ch=true;persist(pid);
    }else if(p.notes){
      const notes=p.notes,byT={};for(const id in notes)byT[lc(notes[id].title)]=id;
      const order=Object.keys(notes).sort((a,b)=>(notes[a].created||0)-(notes[b].created||0));
      const start=byT[lc(p.name)]||order[0];const top=addChild('root',p.name,{project:pid});
      const ids={},seen=new Set();
      const kids=(nid,k)=>{for(const t of L(notes[nid].body)){const c=byT[lc(t)];if(c&&!seen.has(c))make(c,k)}};
      const make=(nid,par)=>{seen.add(nid);const k='n'+uid();ids[nid]=k;S.map[k]={text:notes[nid].title,children:[],body:notes[nid].body||''};S.map[par].children.push(k);kids(nid,k)};
      if(start){seen.add(start);ids[start]=top;S.map[top].body=notes[start].body||'';kids(start,top)}
      for(const nid of order)if(!seen.has(nid))make(nid,top);
      for(const t of p.tasks)if(t.noteId&&ids[t.noteId]){const k=ids[t.noteId];if(!S.map[k].taskId&&k!==top){S.map[k].taskId=t.id;S.map[k].taskPid=pid;t.nodeId=k}}
      delete p.notes;ch=true;persist(pid);

  }
  return ch;
}

    if(id==='root')return;if(isRootId(id)){deleteRoot(id);return}
    const np=subtree(id).filter(k=>m[k].project&&S.projects[m[k].project]).length;
    if(np&&S.confirmNode!==id){S.confirmNode=id;renderMbar();renderPanel();return}   // ask first when projects would be deleted
    S.confirmNode=null;const r=deleteBranch(id);S.sel=r.par||'root';S.panel=S.panel&&!isRootId(r.par)?S.panel:false;
    renderChips();renderMain();

    const R=G[rid]=metrics(rid);R.depth=0;R.branch=null;R.x=-R.w/2;R.y=-R.h/2;R.cy=0;R.dir=1;R.rootOf=rid;

function bindEditor(ta,id){
  const n=S.map[id];const sug=$('#suggest');let items=[],ix=0,ctxm=null,deb=0;
  const close=()=>{sug.innerHTML='';items=[];ctxm=null};
  const show=()=>{const pos=ta.selectionStart,before=ta.value.slice(0,pos),m=before.match(/\[\[([^\]\[\n|#]*)$/);if(!m){close();return}
    ctxm={start:pos-m[1].length};const q=lc(m[1]);const all=[...new Set(Object.keys(S.map).filter(k=>k!==id).map(k=>S.map[k].text).filter(Boolean))];
    items=all.filter(t=>lc(t).includes(q)).sort((a,b)=>(lc(a).startsWith(q)?0:1)-(lc(b).startsWith(q)?0:1)||a.localeCompare(b,'ru')).slice(0,7).map(t=>({t,new:false}));
    if(q&&!all.some(t=>lc(t)===q))items.push({t:m[1].trim(),new:true});if(!items.length){close();return}ix=Math.min(ix,items.length-1);
    sug.innerHTML=`<div class="suggest" role="listbox">${items.map((it,i)=>`<button type="button" role="option" data-si="${i}" aria-selected="${i===ix}" class="${it.new?'new':''}">${it.new?'Ссылка на новый узел «'+esc(it.t)+'»':esc(it.t)}</button>`).join('')}</div>`};
  const commit=()=>{n.body=ta.value;persist('map');clearTimeout(deb);deb=setTimeout(()=>{redrawMap();renderPanelSecs();renderMbar()},300)};
  const pick=i=>{const it=items[i];if(!it||!ctxm)return;const after=ta.value.slice(ta.selectionStart);const cb=after.startsWith(']]')?'':']]';ta.value=ta.value.slice(0,ctxm.start)+it.t+cb+after;const c=ctxm.start+it.t.length+2;ta.setSelectionRange(c,c);close();ta.focus();commit()};
  ta.addEventListener('input',()=>{ix=0;commit();show()});ta.addEventListener('click',show);
  ta.addEventListener('keydown',e=>{
    if(items.length){if(e.key==='ArrowDown'){e.preventDefault();ix=(ix+1)%items.length;show();return}if(e.key==='ArrowUp'){e.preventDefault();ix=(ix-1+items.length)%items.length;show();return}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pick(ix);return}if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();return}}
    if(e.key==='['&&ta.selectionStart===ta.selectionEnd){const pos=ta.selectionStart;if(ta.value[pos-1]==='['&&ta.value.slice(pos,pos+2)!==']]'){e.preventDefault();ta.value=ta.value.slice(0,pos)+'[]]'+ta.value.slice(pos);ta.setSelectionRange(pos+1,pos+1);commit();show()}}});
  sug.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-si]');if(b){e.preventDefault();pick(+b.dataset.si)}});
  ta.addEventListener('blur',()=>setTimeout(close,150));
}

    if(nt){document.getElementById('app').classList.remove('navopen');openTab(scr,mv);return}}
  if(b.dataset.screen&&(e.ctrlKey||e.metaKey)&&(S.projects[b.dataset.screen]||b.dataset.screen==='projects'||b.dataset.screen==='done')){openTab(b.dataset.screen);return}
  if(b.dataset.screen){document.getElementById('app').classList.remove('navopen');if(S.screen!==b.dataset.screen){S.screen=b.dataset.screen;S.confirmDel=false;render()}return}
  const a=b.dataset.act;
  if(a==='newproj'){const rt=(b&&b.dataset.root&&S.map[b.dataset.root])?b.dataset.root:'root';const pid=newProject('Новый проект');addChild(rt,'Новый проект',{project:pid});persist(pid);persist('map');S.screen=pid;render();const i=$('#projName');i.focus();i.select();return}
  if(a==='example'){makeExample();persist('map');for(const pid in S.projects)persist(pid);TVP.init=false;GVP.init=false;render();return}
  if(a==='addsub'){const np=addSubproject(S.screen,'Новый подпроект');S.screen=np;render();const i=$('#projName');i.focus();i.select();return}
  if(a==='projonmap'){const k=nodeOfProject(S.screen);if(k)goNode(k);return}
  if(a==='delproj'){S.confirmDel=true;renderProject();return}
  if(a==='delproj-no'){S.confirmDel=false;renderProject();return}
  if(a==='delproj-yes'){const pid=S.screen;const undo=deleteProject(pid);S.confirmDel=false;S.screen='map';S.sel='root';S.panel=false;render();
    toast('Проект удалён',()=>{undo();S.screen=pid;render()});return}
  if(b.dataset.pcol){const pid=b.dataset.pcol;const i=S.pcol.indexOf(pid);if(i>=0)S.pcol.splice(i,1);else S.pcol.push(pid);cacheLocal();renderProjects();return}
  if(a==='backup'){doBackup();return}
  if(a==='backup-enc'){doBackup('enc');return}
  if(a==='restore'){$('#restoreFile').click();return}
  if(a==='restore-no'){S.restoreAsk=null;renderProjects();return}
  if(a==='restore-yes'){doRestore();return}
  if(a==='collapseall'){S.pcol=sortedProjects().map(([p])=>p);cacheLocal();renderProjects();return}
  if(a==='expandall'){S.pcol=[];cacheLocal();renderProjects();return}
  if(b.dataset.pf){S.pfilter=b.dataset.pf;renderProjects();return}
  if(b.dataset.more){expanded.add(b.dataset.more);renderProjects();return}
  if(b.dataset.mv){if(S.mapView!==b.dataset.mv){S.mapView=b.dataset.mv;S.showSet=false;renderMain();renderChips();cacheLocal()}return}
  if(b.dataset.ck){const f=findTask(b.dataset.ck);if(!f)return;const t=f.t;
    if(b.closest('.npanel'))setStatus(t,t.status==='todo'?'doing':t.status==='doing'?'done':'todo');else setStatus(t,t.status==='done'?'todo':'done');
    afterTaskChange(f.pid);return}
  if(b.dataset.task){openTask(b.dataset.task);return}
  if(b.dataset.m){act(b.dataset.m);return}
  if(b.dataset.link!==undefined){followLink(b.dataset.link);return}
  if(b.dataset.open){openNodePanel(b.dataset.open);return}
  if(b.dataset.np){const x=b.dataset.np;
    if(x==='close'){S.panel=false;renderPanel();redrawMap()}
    else if(x==='view'||x==='edit'){S.noteMode=x;renderPanel();if(x==='edit')setTimeout(()=>{const t=$('#noteBody');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}},30)}
    else act(x);
    return}
  if(b.dataset.g){const x=b.dataset.g;
    if(x==='new'){const par=S.panel&&S.map[S.sel]?S.sel:'root';const k=addChild(par,'Новая идея');persist('map');S.sel=k;S.panel=true;S.noteMode='view';refreshGraph();renderPanel();setTimeout(()=>{graphCenter(k);const t=$('#noteTitle');if(t){t.focus();t.select()}},40)}
    else if(x==='set'){S.showSet=!S.showSet;const ex=$('#gset');if(ex)ex.remove();else{$('#mapbox').insertAdjacentHTML('beforeend',setPanel());bindSet()}b.setAttribute('aria-pressed',S.showSet)}
    else if(x==='fit')graphFit();
    else if(x==='items'){S.mapItems=S.mapItems===false;b.setAttribute('aria-pressed',S.mapItems!==false);cacheLocal();GVP.auto=true;TVP.init=false;redrawMap();if(S.mapView==='tree')treeFit()}
    else if(x==='reset'){S.gopt=Object.assign({},GDEF);cacheLocal();$('#gset')?.remove();$('#mapbox').insertAdjacentHTML('beforeend',setPanel());bindSet();refreshGraph();renderLegend();SIM.alpha=.8;startLoop()}
    return}
  if(b.dataset.z){const box=$('#mapbox');if(b.dataset.z==='fit')treeFit();else treeZoom(b.dataset.z==='in'?1.25:.8,box.clientWidth/2,box.clientHeight/2);return}
});
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('[data-hit]');if(h){e.preventDefault();goHit(h.dataset.hit)}});
document.addEventListener('auxclick',e=>{if(e.button!==1)return;const b=e.target.closest&&e.target.closest('#side [data-screen],#side [data-nav]');if(!b)return;e.preventDefault();
  const scr=b.dataset.screen||'map',mv=b.dataset.nav||S.mapView;if(!PANE&&S.split&&focusPane===1)sendPane({nav:{screen:scr,mapView:b.dataset.nav||null,newTab:true}});else openTab(scr,mv)});
document.addEventListener('mousedown',e=>{if(e.button===1&&e.target.closest&&e.target.closest('#side [data-screen],#side [data-nav],[data-memo],[data-screen]'))e.preventDefault()});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('.tb-tab');if(!t||e.target.closest('.tb-x'))return;switchTab(t.dataset.tabid)});
document.addEventListener('auxclick',e=>{if(e.button!==1||!e.target.closest)return;const mm=e.target.closest('[data-memo]:not(#side *)');if(mm&&findMemo(mm.dataset.memo)){e.preventDefault();flushMemo();openTab('m:'+mm.dataset.memo,null,false);return}
  const ps=e.target.closest('[data-screen]:not(#side *)');if(ps&&S.projects[ps.dataset.screen]){e.preventDefault();openTab(ps.dataset.screen);return}});
document.addEventListener('auxclick',e=>{if(e.button!==1)return;const t=e.target.closest&&e.target.closest('.tb-tab');if(t){e.preventDefault();closeTab(t.dataset.tabid)}});
document.addEventListener('submit',e=>{const fm=e.target;
  if(fm.dataset&&(fm.dataset.addto||fm.dataset.subto)){e.preventDefault();const v=fm.querySelector('input').value.trim();if(!v)return;
    if(fm.dataset.addto){const pid=fm.dataset.addto;S.projects[pid].tasks.push({id:'t'+uid(),title:v,status:'todo',prio:'mid',due:'',notes:'',created:Date.now()});persist(pid)}
    else addSubproject(fm.dataset.subto,v);
    const key=fm.dataset.addto?'addto':'subto',id=fm.dataset[key];renderChips();renderProjects();const nf=document.querySelector(`[data-${key}="${id}"] input`);if(nf)nf.focus();return}
  if(e.target.id==='memoForm'){e.preventDefault();const i=$('#newMemo');const v=i.value.trim();if(!v)return;const m=addMemo(S.screen,v);i.value='';renderMemos();openMemo(m.id,'edit');return}
  if(e.target.id==='subForm'){e.preventDefault();const i=$('#newSub');const v=i.value.trim();if(!v)return;addSubproject(S.screen,v);renderChips();renderSubs();const ni=$('#newSub');if(ni)ni.focus();return}
  if(e.target.id==='addForm'){e.preventDefault();const i=$('#newTask');const v=i.value.trim();if(!v)return;const p=S.projects[S.screen];
  p.tasks.push({id:'t'+uid(),title:v,status:'todo',prio:'mid',due:'',notes:'',created:Date.now()});i.value='';persist(S.screen);renderListOnly();renderChips()}});
document.addEventListener('input',e=>{
  if(e.target.id==='projName'){const pid=S.screen,p=S.projects[pid];p.name=e.target.value;const k=nodeOfProject(pid);if(k){S.map[k].text=p.name;persist('map')}persist(pid);renderChips()}
  if(e.target.id==='gsearch'){S.search=e.target.value;renderSearch();if(S.mapView==='tree')drawTree();dirty=true;startLoop()}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='gsearch'){if(e.key==='Enter'){const h=searchHits()[0];if(h)goHit(h)}else if(e.key==='Escape'){S.search='';e.target.value='';renderSearch();redrawMap();dirty=true;startLoop()}return}
  if(e.key==='Escape'){if(S.openTask||S.openMemo){closeSheet();return}if(S.showSet){S.showSet=false;$('#gset')?.remove();return}if(S.panel&&e.target.id!=='noteBody'){S.panel=false;renderPanel();redrawMap();return}}
  if(e.target.matches&&e.target.matches('.tr[data-task]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(e.target.dataset.task);return}
  if(e.target.matches&&e.target.matches('.tb-tab')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();switchTab(e.target.dataset.tabid);return}
  if(e.target.matches&&e.target.matches('.nl-i[data-task]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(e.target.dataset.task);return}
  if(e.target.matches&&e.target.matches('.nl-i[data-memo]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openMemo(e.target.dataset.memo);return}
  if(e.target.matches&&e.target.matches('.mr[data-memo]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openMemo(e.target.dataset.memo);return}
  if(e.target.matches&&e.target.matches('tr[data-task]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(e.target.dataset.task);return}
  if(e.target.matches&&e.target.matches('tr[data-screen]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.screen=e.target.dataset.screen;render();return}
  if(e.target.matches&&e.target.matches('.nl-row[data-screen]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.screen=e.target.dataset.screen;render();return}
  if(e.target.matches&&e.target.matches('.sr[data-screen]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.screen=e.target.dataset.screen;render();return}
  if(S.screen!=='map'||S.mapView!=='tree'||S.openTask)return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;
  if(e.key==='Tab'){e.preventDefault();act('child')}
  else if(e.key==='Enter'){e.preventDefault();isRootId(S.sel)?act('child'):act('sib')}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();act('del')}
  else if(e.key==='F2'){e.preventDefault();const i=$('#nodeText');i?.focus();i?.select()}
});

/* ---------- boot ---------- */
try{const raw=lsGet(LSK);if(raw)S.projects=JSON.parse(raw)||{};const mp=JSON.parse(lsGet(LSK+'.map')||'null');if(mp&&mp.root)S.map=mp;
  const ui=JSON.parse(lsGet(UIK)||'{}');if(Array.isArray(ui.tabs)&&ui.tabs.length){S.tabs=ui.tabs;S.tab=ui.tab}if(ui.split&&!PANE)S.split=ui.split;
  if(PANE){const hu=JSON.parse(lsGet(LSK+'.ui')||'{}');ui.skin=hu.skin;ui.v2=hu.v2;if(!ui.tabs){const q=new URLSearchParams(location.search);ui.screen=q.get('screen')||'map';ui.mapView=q.get('mv')||'graph'}}if(ui.mapView)S.mapView=ui.mapView;if(ui.gopt)Object.assign(S.gopt,ui.gopt);if(Array.isArray(ui.pcol))S.pcol=ui.pcol;if(Array.isArray(ui.ptasks))S.ptasks=ui.ptasks;if(ui.mapItems===false)S.mapItems=false;if(ui.showArch===false)S.showArch=false;if(Array.isArray(ui.scol))S.scol=ui.scol;if(ui.pitems===false)S.pitems=false;if(ui.skin)S.skin=ui.skin;if(!ui.v2)S.skin='night';if(ui.screen&&(ui.screen==='map'||ui.screen==='projects'||ui.screen==='done'||S.projects[ui.screen]||isMemoScr(ui.screen)))S.screen=ui.screen}catch(e){S.projects={}}
if(!S.map)S.map=newMap();
if(!S.skin)S.skin='night';
if(S.skin&&S.skin!=='shtab'){document.documentElement.dataset.skin=S.skin;loadFonts([SKINS.find(x=>x.id===S.skin)||SKINS[0]]);updFonts();if(document.fonts)document.fonts.ready.then(refreshSkinDeps)}
migrateOld();reconcile();
ensureTabs();{const t=curTab();if(t){S.screen=t.screen;S.mapView=t.mapView}}
render();applySplit();$('#sync').textContent='Подключаю облако…';
initStore();
})();
