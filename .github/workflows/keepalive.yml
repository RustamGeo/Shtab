name: Не давать базе уснуть

# Бесплатный проект Supabase засыпает после 7 дней без обращений.
# Раз в день этот сценарий делает один лёгкий запрос к базе.
on:
  schedule:
    - cron: '17 6 * * *'   # каждый день в 09:17 по Москве
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Пинг базы
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" config.js || true)
          KEY=$(grep -oP "anonKey:\s*'\K[^']+" config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js ещё не заполнен — пропускаю"
            exit 0
          fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
