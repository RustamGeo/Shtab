.tile{background:var(--surface);border:0;border-radius:var(--rc);padding:10px 12px 10px 10px;text-align:left;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:6px 8px;align-items:center;color:var(--ink)}
.tile .ti{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--tc)}
.tile .tn{justify-self:end;font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .tl{grid-column:1/-1;font-size:15px;font-weight:600;color:var(--muted)}
.tile[aria-pressed="true"]{background:var(--tc);color:#fff}
.tile[aria-pressed="true"] .ti{background:#fff;color:var(--tc)}
.tile[aria-pressed="true"] .tl{color:#fff}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto}

.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);font-style:normal;font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="cloud"]::before{background:var(--ok)}
.sync[data-s="err"]::before{background:var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin;align-items:center}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:6px 12px 6px 10px;font-size:14px;max-width:240px}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip[aria-current="true"] .n{color:inherit;opacity:.7}
.chip.mapchip{font-weight:600;padding-left:12px}
.chip.add{border-style:dashed;color:var(--muted);background:transparent}
.navsep{flex:none;width:1px;height:22px;background:var(--line)}

.phead{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:end;padding-block:8px 14px;border-bottom:1px solid var(--line)}
.pname{min-width:0;width:100%;border:0;background:transparent;font-family:var(--f-display);font-weight:var(--dw);font-size:clamp(20px,4.6vw,30px);line-height:1.15;padding:2px 0;border-radius:6px;margin:0}
input.pname:hover{background:var(--sunk)}
.pmeta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap;grid-column:1/-1}
.bar{flex:1;min-width:120px;max-width:320px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tabs{display:inline-flex;background:var(--sunk);border-radius:var(--rs);padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:500;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ghost{border:1px solid transparent;background:transparent;border-radius:var(--rs);padding:6px 10px;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:5px}
.ghost:hover{background:var(--sunk);color:var(--ink)}
.danger{color:var(--bad)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:10px 16px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:var(--sunk);color:var(--ink)}

/* task list */
.add-task{display:flex;gap:8px;margin-block:16px}
.add-task input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 14px}
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);overflow:hidden}
.trow{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:hover{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.ck{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.8px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:var(--surface)}
.ck:hover{border-color:var(--ok)}
.ck.doing{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.ck.done{border-color:var(--ok);background:var(--ok)}
.tbody{flex:1;min-width:0}
.ttl{font-weight:500;overflow-wrap:anywhere}
.trow.done .ttl{color:var(--muted);text-decoration:line-through}
.tmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:3px}
.tmeta:empty{display:none}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px}
.pill.doing{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.prio{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;letter-spacing:.02em}
.prio.high{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.prio.low{background:var(--sunk);color:var(--muted)}
.due{font-family:var(--f-mono);font-size:11px}
.due.late{color:var(--bad);font-weight:600}
.linkmark{display:inline-flex;align-items:center;gap:3px}
.tempty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
details.donebox{margin-top:14px}
details.donebox summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 2px;list-style:none;display:flex;gap:6px;align-items:center}
details.donebox summary::-webkit-details-marker{display:none}
details.donebox summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:16px}
details.donebox[open] summary::before{transform:rotate(90deg)}
details.donebox .tlist{margin-top:6px}

/* map shell */
.mapbox{position:relative;margin-top:14px;height:max(420px,calc(var(--paneh,100dvh) - 230px));background:var(--g-bg);border:1px solid var(--line);border-radius:var(--rc);overflow:hidden}
.mapbox.tree{background-color:var(--surface);background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.mapbox>svg,.mapbox>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox .grab{cursor:grabbing}
.mapbox canvas.pt{cursor:pointer}
.mtop{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:2}
.mtop>*{pointer-events:auto}
.mhint{font-size:12px;color:var(--muted);background:var(--surface);padding:4px 8px;border-radius:7px;border:1px solid var(--line)}
.gsearch{flex:0 1 220px;min-width:110px;border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:7px 10px;font-size:14px}
.gbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);height:34px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.gbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.gbtn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.gbtn.ico{width:34px;padding:0;justify-content:center}
.mtools{position:absolute;right:10px;top:54px;display:flex;flex-direction:column;gap:6px;z-index:2}
.gcount{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.gset{position:absolute;top:52px;right:10px;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 28px rgba(10,20,30,.18);z-index:3}
.gset label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.gset label.ckl{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.gset input[type=range]{width:100%;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* tree */
.node{cursor:pointer}
.node text{font-family:var(--f-body);font-size:14px;font-weight:500;fill:var(--ink);dominant-baseline:central;pointer-events:none}
.node text .st{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.node.root text{font-family:var(--f-display);font-size:15px;fill:var(--bg)}
.node rect.box{fill:var(--surface);stroke-width:1.5}
.node.l1 rect.box{stroke-width:2.2}
.node.proj rect.box{stroke-width:2.6}
.node.root rect.box{fill:var(--ink);stroke:var(--ink)}
.node.sel rect.ring{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:4 3}
.edge{fill:none;stroke-width:2;stroke-linecap:round}
.tog{cursor:pointer}
.tog circle{fill:var(--surface);stroke-width:1.5}
.tog text{font-family:var(--f-mono);font-size:10px;dominant-baseline:central;text-anchor:middle;pointer-events:none}
.mbar{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;box-shadow:0 6px 24px rgba(10,20,30,.14);z-index:2}
@media (min-width:761px){.mapbox.haspanel .mbar{right:410px}}
.mbar input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:var(--rs);padding:8px 10px}
.mbar button{border:1px solid var(--line);background:var(--bg);border-radius:var(--rs);padding:7px 10px;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.mbar button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mbar button.danger{color:var(--bad)}

/* node panel */
.npanel{position:absolute;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:4;box-shadow:-10px 0 30px rgba(10,20,30,.10)}
@media (max-width:760px){
  .npanel{left:0;right:0;top:auto;bottom:0;width:auto;height:58%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(10,20,30,.22)}
  .mapbox.haspanel .mbar{display:none}

  splith:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><path d="M1.8 8h12.4"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>'
};

/* ---------- state ---------- */
const S={projects:{},map:null,screen:'map',mapView:'tree',sel:'root',panel:false,noteMode:'view',openTask:null,confirmDel:false,
  gopt:{labels:true,orphans:true,repel:1,dist:1,center:1,gap:14,nolabel:true,size:1,sizeMode:'links',text:1,group:true,gstr:1},search:'',showSet:false,pcol:[],ptasks:[],mapItems:true,pitems:true,tabs:null,tab:null,split:null,tsort:{k:'status',dir:1},showDone:false,confirmSub:null};
let col=null,firstSnap=true,dl=null;
const pend={};
const LSK='shtab.v1';
const UIK=LSK+'.ui'+(PANE?'.pane'+PANE:'');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let synced=new Set();try{synced=new Set(JSON.parse(localStorage.getItem('shtab.v1.synced')||'[]'))}catch(e){}
function cacheLocal(){lsSet(LSK,JSON.stringify(S.projects));lsSet(LSK+'.synced',JSON.stringify([...synced]));lsSet(LSK+'.map',JSON.stringify(S.map));lsSet(UIK,JSON.stringify({tabs:S.tabs,tab:S.tab,split:S.split,screen:S.screen,mapView:S.mapView,gopt:S.gopt,pcol:S.pcol,ptasks:S.ptasks,skin:S.skin,v2:1,mapItems:S.mapItems,pitems:S.pitems}))}
function setSync(s){const el=$('#sync');el.dataset.s=s;const tm=lastSaved?new Date(lastSaved).toTimeString().slice(0,5):'';
  el.textContent=s==='cloud'?'Сохранено в облаке'+(tm?' · '+tm:''):s==='err'?'Нет связи, повторю сохранение…':s==='saving'?'Сохраняю…':'Только на этом устройстве';
  el.title=s==='local'?'Облако недоступно в этом окне. Данные лежат в браузере — сделайте резервную копию на вкладке «Проекты».':''}

/* ---------- persistence: one doc per project + one "map" doc ----------
   Each written doc carries _t (time of the local change). A snapshot older than
   our latest local change is ignored, so late or stale refreshes never roll back edits. */
const LT={};            // id -> time of latest local change
const seenRemote=new Set();
let lastSaved=0;
const strip=o=>{const c=clone(o);delete c._t;return c};
const docData=id=>id==='map'?(S.map?{kind:'map',nodes:S.map}:null):S.projects[id];
function persist(id){
  LT[id]=Date.now();
  cacheLocal();if(!col)return;
  const p=pend[id]||(pend[id]={t:0,waiting:false,busy:false,again:false});
  clearTimeout(p.t);p.waiting=true;setSync('saving');p.t=setTimeout(()=>flush(id),500);
}
async function flush(id){
  const p=pend[id];if(!p)return;clearTimeout(p.t);p.waiting=false;if(p.busy){p.again=true;return}p.busy=true;
  try{const d=docData(id);if(d){const body=clone(d);body._t=LT[id]||Date.now();await col.doc(id).set(body);seenRemote.add(id);if(id!=='map')synced.add(id)}else{await col.doc(id).delete();seenRemote.delete(id);synced.delete(id)}cacheLocal();lastSaved=Date.now();if(!anyPending())setSync('cloud')}
  catch(e){setSync('err');p.busy=false;p.waiting=true;p.t=setTimeout(()=>flush(id),4000);return}
  p.busy=false;if(p.again){p.again=false;flush(id)}
}
function anyPending(){return Object.values(pend).some(p=>p.waiting||p.busy||p.again)}
function flushAll(){if(!col)return;for(const id in pend)if(pend[id].waiting)flush(id)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});
window.addEventListener('pagehide',flushAll);
window.addEventListener('beforeunload',e=>{if(anyPending()){flushAll();e.preventDefault();e.returnValue=''}});
const isPending=id=>{const p=pend[id];return p&&(p.waiting||p.busy||p.again)};
const stale=(id,data)=>isPending(id)||((data&&data._t)||0)<(LT[id]||0);
function onSnap(qs){
  const seen=new Set();let changed=false,mapDoc=null;
  for(const d of qs.docs){seen.add(d.id);const data=d.data();if(!data)continue;
    if(d.id==='map'){mapDoc=data;continue}
    if(stale(d.id,data)){seenRemote.add(d.id);continue}
    seenRemote.add(d.id);synced.add(d.id);
    const nd=strip(data),cur=S.projects[d.id];if(!cur||JSON.stringify(cur)!==JSON.stringify(nd)){S.projects[d.id]=nd;changed=true}}
  if(firstSnap){
    firstSnap=false;
    for(const id of Object.keys(S.projects))if(!seen.has(id)){if(synced.has(id)&&!LT[id]){delete S.projects[id];synced.delete(id)}else persist(id)}
    if(mapDoc&&mapDoc.nodes&&mapDoc.nodes.root){if(!stale('map',mapDoc)||!S.map)S.map=clone(mapDoc.nodes);seenRemote.add('map')}else if(!S.map)S.map=newMap();
    changed=true;
    const m1=migrateOld(),m2=reconcile();if(m1||m2||!mapDoc)persist('map');
  }else{
    // a project disappears only if we had seen it in the cloud and haven't touched it for a minute
    for(const id of Object.keys(S.projects))if(!seen.has(id)&&seenRemote.has(id)&&!isPending(id)&&Date.now()-(LT[id]||0)>60000){delete S.projects[id];seenRemote.delete(id);synced.delete(id);changed=true}
    if(mapDoc&&mapDoc.nodes&&mapDoc.nodes.root&&!stale('map',mapDoc)&&JSON.stringify(mapDoc.nodes)!==JSON.stringify(S.map)){S.map=clone(mapDoc.nodes);changed=true}
    if(changed&&reconcile())persist('map');
  }
  if(!anyPending()){if(!lastSaved)lastSaved=Date.now();setSync('cloud')}
  if(changed){cacheLocal();if(S.screen!=='map'&&S.screen!=='projects'&&!S.projects[S.screen])S.screen='map';if(!S.map[S.sel])S.sel='root';renderSafe()}
}
async function initStore(){
  let db=null,user=null,id=null;
  try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}}catch(e){}
  try{id=user?await user.id():null}catch(e){}
  if(db&&id){col=db.collection('data/users/'+id);setSync('saving');
    const sub=()=>col.onSnapshot(onSnap,()=>{setSync('err');setTimeout(()=>{if(col)sub()},5000)});sub()}
  else setSync('local');
  try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(S.screen==='projects')renderProjects();
}

/* ---------- model ---------- */
const newMap=()=>({root:{text:'Мои проекты',children:[]}});
const sortedProjects=()=>Object.entries(S.projects).sort((a,b)=>(a[1].created||0)-(b[1].created||0));
function parentOf(id){for(const k in S.map)if(S.map[k].children.includes(id))return k;return null}
function pathOf(id){const out=[];let c=id,guard=0;while(c&&guard++<200){out.unshift(c);if(c==='root')break;c=parentOf(c)}return out}
function projOf(id){let c=id,guard=0;while(c&&guard++<200){const n=S.map[c];if(n&&n.project&&S.projects[n.project])return n.project;if(c==='root')return null;c=parentOf(c)}return null}
function nodeOfProject(pid){for(const k in S.map)if(S.map[k].project===pid)return k;return null}
function taskOf(n){if(!n||!n.taskId)return null;const p=S.projects[n.taskPid];return p?p.tasks.find(t=>t.id===n.taskId)||null:null}
function subtree(id,acc=[]){acc.push(id);for(const c of S.map[id].children)if(S.map[c])subtree(c,acc);return acc}
function pickSide(){const m=S.map;let r=0,l=0;for(const c of m.root.children){if(!m[c])continue;const n=subtree(c).length;m[c].side==='left'?l+=n:r+=n}return l<r?'left':'right'}
function nodeByText(t){const k=lc(t);if(!k)return null;for(const id in S.map)if(lc(S.map[id].text)===k)return id;return null}
function parentProject(pid){const k=nodeOfProject(pid);if(!k)return null;const par=parentOf(k);return par?projOf(par):null}
function childProjects(pid){return sortedProjects().filter(([id])=>parentProject(id)===pid)}
function topProjects(){return sortedProjects().filter(([id])=>!parentProject(id))}
function projChain(pid){const out=[];let c=parentProject(pid),g=0;while(c&&g++<50){out.unshift(c);c=parentProject(c)}return out}
function treeStats(pid){let t=0,d=0;const walk=id=>{const p=S.projects[id];t+=p.tasks.length;d+=p.tasks.filter(x=>x.status==='done').length;for(const [c] of childProjects(id))walk(c)};walk(pid);return{t,d,pct:t?Math.round(d/t*100):0}}
function addSubproject(pid,name){const k=nodeOfProject(pid);const np=newProject(name||'Новый подпроект');addChild(k||'root',S.projects[np].name,{project:np});persist(np);persist('map');return np}
function topProjOf(pid){return projChain(pid)[0]||pid}
function colorOf(p){const c=p?p.color:0;return typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c)?c:`var(${PCOL[(+c||0)%PCOL.length]})`}
function projColor(pid){return colorOf(S.projects[topProjOf(pid)])}
const SWATCH=['#7C6CF2','#B07CE8','#E06C9F','#EB5757','#EB7A4A','#E8A23B','#E3C43A','#9CC740','#4CB782','#2BB3C0','#5BA4F0','#3D6FD9','#8A8F98','#C9A27E'];
function openColorPicker(pid,anchor){
  closeColorPicker();const p=S.projects[pid];if(!p)return;const cur=typeof p.color==='string'?p.color.toLowerCase():'';

      const make=(nid,par)=>{seen.add(nid);const k='n'+uid();ids[nid]=k;S.map[k]={text:notes[nid].title,children:[],body:notes[nid].body||''};S.map[par].children.push(k);kids(nid,k)};
      if(start){seen.add(start);ids[start]=top;S.map[top].body=notes[start].body||'';kids(start,top)}
      for(const nid of order)if(!seen.has(nid))make(nid,top);

function deleteTask(pid,tid){

/* ---------- deleting ---------- */
// delete one project; its direct subprojects move up one level
function deleteProject(pid){
  const snapP=clone(S.projects[pid]),snapM=clone(S.map);const k=nodeOfProject(pid);
  delete S.projects[pid];
  if(k){const up=parentOf(k)||'root';
    for(const x of subtree(k)){if(x===k||!S.map[x]||!S.map[x].project||!S.projects[S.map[x].project])continue;
      let c=parentOf(x),direct=true;while(c&&c!==k){if(S.map[c].project&&S.projects[S.map[c].project]){direct=false;break}c=parentOf(c)}
      if(direct&&c===k){const pp=parentOf(x);S.map[pp].children=S.map[pp].children.filter(z=>z!==x);if(up==='root')S.map[x].side=pickSide();S.map[up].children.push(x)}}
    const ids=subtree(k);S.map[up].children=S.map[up].children.filter(z=>z!==k);for(const x of ids)delete S.map[x]}
  for(const x in S.map){const n=S.map[x];if(n.taskPid===pid){delete n.taskId;delete n.taskPid}}
  persist(pid);persist('map');
  return ()=>{S.projects[pid]=snapP;S.map=snapM;persist(pid);persist('map')};
}
// delete a whole map branch, including every project inside it
function deleteBranch(id){
  const m=S.map,ids=subtree(id),par=parentOf(id);const pids=ids.map(k=>m[k].project).filter(p=>p&&S.projects[p]);
  const snapM=clone(m),snapP={},snapT={};for(const p of pids)snapP[p]=clone(S.projects[p]);
  for(const k of ids){const t=taskOf(m[k]);if(t&&!pids.includes(m[k].taskPid)){const tp=m[k].taskPid;if(!snapT[tp])snapT[tp]=clone(S.projects[tp]);delete t.nodeId}}
  m[par].children=m[par].children.filter(c=>c!==id);for(const k of ids)delete m[k];
  for(const p of pids)delete S.projects[p];
  for(const x in m){if(pids.includes(m[x].taskPid)){delete m[x].taskId;delete m[x].taskPid}}
  persist('map');for(const p of pids)persist(p);for(const tp in snapT)persist(tp);
  return{par,n:ids.length,np:pids.length,undo:()=>{S.map=snapM;persist('map');for(const p in snapP){S.projects[p]=snapP[p];persist(p)}for(const tp in snapT){S.projects[tp]=snapT[tp];persist(tp)}}};
}

  else if(a==='totask'){const pid=projOf(id);if(!pid||n.taskId)return;const t={id:'t'+uid(),title:n.text,status:'todo',prio:'mid',due:'',notes:'',created:Date.now(),nodeId:id};S.projects[pid].tasks.push(t);n.taskId=t.id;n.taskPid=pid;persist('map');afterTaskChange(pid);toast('Задача добавлена в «'+S.projects[pid].name+'»')}
  else if(a==='opentask'){if(n.taskId)openTask(n.taskId)}
  else if(a==='mkproj'){if((n.project&&S.projects[n.project])||id==='root')return;const pid=newProject(n.text||'Новый проект');n.project=pid;persist(pid);persist('map');renderChips();redrawMap();renderPanel(true);renderMbar();toast('Проект «'+S.projects[pid].name+'» создан')}

  else if(a==='del'){
    if(id==='root')return;
    const np=subtree(id).filter(k=>m[k].project&&S.projects[m[k].project]).length;
    if(np&&S.confirmNode!==id){S.confirmNode=id;renderMbar();renderPanel();return}   // ask first when projects would be deleted

  }
  else if(a==='delno'){S.confirmNode=null;renderMbar();renderPanel()}
}

/* ===== Дерево ===== */
const meas=document.createElement('canvas').getContext('2d');
function textW(s,font){meas.font=font;return meas.measureText(s).width}
let F_ROOT,F_NODE,F_MONO,F_BODY;
function updFonts(){const cs=getComputedStyle(document.documentElement);const v=n=>cs.getPropertyValue(n).trim();F_BODY=v('--f-body')||'system-ui, sans-serif';
  F_ROOT=`${v('--dw')||500} 15px ${v('--f-display')||'sans-serif'}`;F_NODE=`500 14px ${F_BODY}`;F_MONO=`500 11px ${v('--f-mono')||'monospace'}`}
updFonts();
function fitText(s,font,max){s=s||'…';if(textW(s,font)<=max)return s;while(s.length>1&&textW(s+'…',font)>max)s=s.slice(0,-1);return s+'…'}
const MAXW=230,VG=12,HG=46;
let TG={};
const TVP={x:0,y:0,k:1,init:false};
function layoutTree(){
  buildVirtual();const m=S.map,G={};
  const metrics=id=>{const n=nodeObj(id),root=id==='root',virt=!m[id];const font=root?F_ROOT:F_NODE;const label=fitText(n.text,font,MAXW);
    let extra=root?36:(taskOf(n)?42:n.memoId?45:26);let st='';if(n.project&&S.projects[n.project]){const s=stats(S.projects[n.project]);st=` ${s.d}/${s.t}`;extra+=textW(st,F_MONO)+4}
    return{label,st,w:Math.max(root?120:56,textW(label,font)+extra),h:root?48:(n.project?38:virt?30:34)}};
  const size=id=>{const g=metrics(id);G[id]=g;const n=nodeObj(id);const kids=n.collapsed?[]:treeKids(id);let kh=0;kids.forEach((c,i)=>{kh+=size(c)+(i?VG:0)});g.kh=kh;g.sub=Math.max(g.h,kh);return g.sub};
  const place=(id,x,top,dir,branch,depth)=>{const g=G[id],n=nodeObj(id);g.cy=top+g.sub/2;g.x=dir>0?x:x-g.w;g.y=g.cy-g.h/2;g.dir=dir;g.branch=branch;g.depth=depth;
    if(n.collapsed)return;let y=g.cy-g.kh/2;const nx=dir>0?g.x+g.w+HG:g.x-HG;for(const c of treeKids(id)){place(c,nx,y,dir,branch,depth+1);y+=G[c].sub+VG}};
  const R=G.root=metrics('root');R.depth=0;R.branch=null;R.x=-R.w/2;R.y=-R.h/2;R.cy=0;R.dir=1;
  const kids=m.root.children.filter(c=>m[c]);const right=kids.filter(c=>m[c].side!=='left'),left=kids.filter(c=>m[c].side==='left');
  const stack=(arr,dir)=>{let tot=0;arr.forEach((c,i)=>{tot+=size(c)+(i?VG*1.6:0)});let y=-tot/2;arr.forEach(c=>{place(c,dir>0?R.w/2+HG+10:-R.w/2-HG-10,y,dir,c,1);y+=G[c].sub+VG*1.6})};
  stack(right,1);stack(left,-1);
  return G;
}
function branchColor(bid){if(!bid)return'var(--ink)';const n=S.map[bid];if(n&&n.project&&S.projects[n.project])return projColor(n.project);const i=S.map.root.children.indexOf(bid);return `var(${PCOL[(i<0?0:i)%PCOL.length]})`}

function drawTree(){
  const g=$('#tg');if(!g)return;const m=S.map;TG=layoutTree();let html='';
  const edges=id=>{const n=nodeObj(id);if(n.collapsed)return;const a=TG[id];for(const c of treeKids(id)){const b=TG[c];if(!b||b.x===undefined)continue;
    const x1=b.dir>0?a.x+a.w:a.x,y1=a.cy,x2=b.dir>0?b.x:b.x+b.w,y2=b.cy,mx=(x1+x2)/2;const virt=!m[c];
    html+=`<path class="edge${virt?' vedge':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="${branchColor(b.branch)}" stroke-opacity="${virt?.45:b.depth>1?.6:.9}"/>`;edges(c)}};
  edges('root');
  for(const id in TG){const a=TG[id];if(a.x===undefined)continue;const n=nodeObj(id);const virt=!m[id];const root=id==='root';const col=branchColor(a.branch);const t=taskOf(n);
    const isP=n.project&&S.projects[n.project];
    const q=lc(S.search);const cls='node'+(root?' root':'')+(a.depth===1?' l1':'')+(isP?' proj':'')+(virt?' virt':'')+(n.memoId?' memo':'')+(id===S.sel?' sel':'')+(q&&lc(n.text).includes(q)?' hit':'');
    let mark='';const cx=a.x+15,cy=a.cy;

      ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(.9,r*.2);ctx.lineCap='round';ctx.beginPath();for(const dy of[-.38,0,.38]){ctx.moveTo(n.x-r*.45,n.y+dy*r);ctx.lineTo(n.x+r*.5,n.y+dy*r)}ctx.stroke()}

function graphZoom(f,cx,cy){GVP.auto=false;const v=GVP,k=Math.min(4,Math.max(.15,v.k*f)),r=k/v.k;v.x=cx-(cx-v.x)*r;v.y=cy-(cy-v.y)*r;v.k=k;dirty=true;startLoop()}

  const pad=30,top=50,bot=$('#npanel')&&$('#npanel').offsetWidth>=w-2?10:70;const k=Math.min(1.6,Math.max(.2,Math.min((w-pad*2)/(x1-x0||1),(h-pad*2-top-bot)/(y1-y0||1))));GVP.k=k;GVP.x=w/2-(x0+x1)/2*k;GVP.y=top+(h-top-bot)/2-(y0+y1)/2*k;GVP.init=true;GVP.auto=true;dirty=true;startLoop()}

function bindGraph(){
  const pts=new Map();let st=null,moved=false,pinch=null,drag=null;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const p=gpt(e);pts.set(e.pointerId,p);moved=false;
    if(pts.size===1){const n=ghit(p.x,p.y);st={x:p.x,y:p.y,vx:GVP.x,vy:GVP.y,node:n};drag=n}
    else if(pts.size===2){if(drag){drag.fx=drag.fy=null;drag=null}const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:GVP.k}}});
  cv.addEventListener('pointermove',e=>{const p=gpt(e);
    if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const n=ghit(p.x,p.y);if(n!==hover){hover=n;cv.classList.toggle('pt',!!n);dirty=true;startLoop()}}return}

    if(!st)return;const dx=p.x-st.x,dy=p.y-st.y;if(!moved&&Math.abs(dx)+Math.abs(dy)>4){moved=true;cv.classList.add('grab')}if(!moved)return;
    if(drag){drag.fx=(p.x-GVP.x)/GVP.k;drag.fy=(p.y-GVP.y)/GVP.k;hover=drag;SIM.alpha=Math.max(SIM.alpha,.3);startLoop()}
    else{GVP.auto=false;GVP.x=st.vx+dx;GVP.y=st.vy+dy;dirty=true;startLoop()}});
  const up=e=>{const tap=!moved&&st&&pts.size===1;const n=st&&st.node;pts.delete(e.pointerId);if(pts.size<2)pinch=null;
    if(pts.size===0){cv.classList.remove('grab');if(drag){drag.fx=drag.fy=null;drag=null;if(e.pointerType!=='mouse')hover=null;dirty=true;startLoop()}if(tap&&n)onGraphTap(n);st=null}

function mdInline(s){
  let h=esc(s);
  h=h.replace(/\[\[([^\]\|#\n]+)(?:#[^\]\|\n]*)?(?:\|([^\]\n]+))?\]\]/g,(m,t,alias)=>{const raw=t.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');return `<button type="button" class="wl ${nodeByText(raw)?'':'ghostl'}" data-link="${t}">${alias||t}</button>`});

  h=h.replace(/(^|\s)#([\p{L}\d_\-/]+)/gu,'$1<span class="tag">#$2</span>');return h;
}
function mdRender(src){

    if((m=l.match(/^(#{1,3})\s+(.*)$/))){fp();cl();out+=`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`;continue}
    if((m=l.match(/^\s*[-*]\s+\[( |x|X)\]\s*(.*)$/))){fp();if(!inList){out+='<ul>';inList=true}out+=`<li class="cb">${m[1]===' '?'☐':'☑'} ${mdInline(m[2])}</li>`;continue}

  fp();cl();return out;
}

function bindEditor(ta,id){
  const n=S.map[id];const sug=$('#suggest');let items=[],ix=0,ctxm=null,deb=0;
  const close=()=>{sug.innerHTML='';items=[];ctxm=null};
  const show=()=>{const pos=ta.selectionStart,before=ta.value.slice(0,pos),m=before.match(/\[\[([^\]\[\n|#]*)$/);if(!m){close();return}
    ctxm={start:pos-m[1].length};const q=lc(m[1]);const all=[...new Set(Object.keys(S.map).filter(k=>k!==id).map(k=>S.map[k].text).filter(Boolean))];
    items=all.filter(t=>lc(t).includes(q)).sort((a,b)=>(lc(a).startsWith(q)?0:1)-(lc(b).startsWith(q)?0:1)||a.localeCompare(b,'ru')).slice(0,7).map(t=>({t,new:false}));
    if(q&&!all.some(t=>lc(t)===q))items.push({t:m[1].trim(),new:true});if(!items.length){close();return}ix=Math.min(ix,items.length-1);
    sug.innerHTML=`<div class="suggest" role="listbox">${items.map((it,i)=>`<button type="button" role="option" data-si="${i}" aria-selected="${i===ix}" class="${it.new?'new':''}">${it.new?'Ссылка на новый узел «'+esc(it.t)+'»':esc(it.t)}</button>`).join('')}</div>`};
  const commit=()=>{n.body=ta.value;persist('map');clearTimeout(deb);deb=setTimeout(()=>{redrawMap();renderPanelSecs();renderMbar()},300)};
  const pick=i=>{const it=items[i];if(!it||!ctxm)return;const after=ta.value.slice(ta.selectionStart);const cb=after.startsWith(']]')?'':']]';ta.value=ta.value.slice(0,ctxm.start)+it.t+cb+after;const c=ctxm.start+it.t.length+2;ta.setSelectionRange(c,c);close();ta.focus();commit()};
  ta.addEventListener('input',()=>{ix=0;commit();show()});ta.addEventListener('click',show);
  ta.addEventListener('keydown',e=>{
    if(items.length){if(e.key==='ArrowDown'){e.preventDefault();ix=(ix+1)%items.length;show();return}if(e.key==='ArrowUp'){e.preventDefault();ix=(ix-1+items.length)%items.length;show();return}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pick(ix);return}if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();return}}
    if(e.key==='['&&ta.selectionStart===ta.selectionEnd){const pos=ta.selectionStart;if(ta.value[pos-1]==='['&&ta.value.slice(pos,pos+2)!==']]'){e.preventDefault();ta.value=ta.value.slice(0,pos)+'[]]'+ta.value.slice(pos);ta.setSelectionRange(pos+1,pos+1);commit();show()}}});
  sug.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-si]');if(b){e.preventDefault();pick(+b.dataset.si)}});
  ta.addEventListener('blur',()=>setTimeout(close,150));
}

    return}
  if(b.dataset.g){const x=b.dataset.g;
    if(x==='new'){const par=S.panel&&S.map[S.sel]?S.sel:'root';const k=addChild(par,'Новая идея');persist('map');S.sel=k;S.panel=true;S.noteMode='view';refreshGraph();renderPanel();setTimeout(()=>{graphCenter(k);const t=$('#noteTitle');if(t){t.focus();t.select()}},40)}
    else if(x==='set'){S.showSet=!S.showSet;const ex=$('#gset');if(ex)ex.remove();else{$('#mapbox').insertAdjacentHTML('beforeend',setPanel());bindSet()}b.setAttribute('aria-pressed',S.showSet)}
    else if(x==='fit')graphFit();
    else if(x==='items'){S.mapItems=S.mapItems===false;b.setAttribute('aria-pressed',S.mapItems!==false);cacheLocal();GVP.auto=true;TVP.init=false;redrawMap();if(S.mapView==='tree')treeFit()}
    else if(x==='reset'){S.gopt=Object.assign({},GDEF);cacheLocal();$('#gset')?.remove();$('#mapbox').insertAdjacentHTML('beforeend',setPanel());bindSet();refreshGraph();renderLegend();SIM.alpha=.8;startLoop()}
    return}
  if(b.dataset.z){const box=$('#mapbox');if(b.dataset.z==='fit')treeFit();else treeZoom(b.dataset.z==='in'?1.25:.8,box.clientWidth/2,box.clientHeight/2);return}
});
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('[data-hit]');if(h){e.preventDefault();goHit(h.dataset.hit)}});
document.addEventListener('auxclick',e=>{if(e.button!==1)return;const b=e.target.closest&&e.target.closest('#side [data-screen],#side [data-nav]');if(!b)return;e.preventDefault();
  const scr=b.dataset.screen||'map',mv=b.dataset.nav||S.mapView;if(!PANE&&S.split&&focusPane===1)sendPane({nav:{screen:scr,mapView:b.dataset.nav||null,newTab:true}});else openTab(scr,mv)});
document.addEventListener('mousedown',e=>{if(e.button===1&&e.target.closest&&e.target.closest('#side [data-screen],#side [data-nav]'))e.preventDefault()});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('.tb-tab');if(!t||e.target.closest('.tb-x'))return;switchTab(t.dataset.tabid)});
document.addEventListener('auxclick',e=>{if(e.button!==1)return;const t=e.target.closest&&e.target.closest('.tb-tab');if(t){e.preventDefault();closeTab(t.dataset.tabid)}});
document.addEventListener('submit',e=>{const fm=e.target;
  if(fm.dataset&&(fm.dataset.addto||fm.dataset.subto)){e.preventDefault();const v=fm.querySelector('input').value.trim();if(!v)return;
    if(fm.dataset.addto){const pid=fm.dataset.addto;S.projects[pid].tasks.push({id:'t'+uid(),title:v,status:'todo',prio:'mid',due:'',notes:'',created:Date.now()});persist(pid)}
    else addSubproject(fm.dataset.subto,v);
    const key=fm.dataset.addto?'addto':'subto',id=fm.dataset[key];renderChips();renderProjects();const nf=document.querySelector(`[data-${key}="${id}"] input`);if(nf)nf.focus();return}
  if(e.target.id==='memoForm'){e.preventDefault();const i=$('#newMemo');const v=i.value.trim();if(!v)return;const m=addMemo(S.screen,v);i.value='';renderMemos();openMemo(m.id,'edit');return}
  if(e.target.id==='subForm'){e.preventDefault();const i=$('#newSub');const v=i.value.trim();if(!v)return;addSubproject(S.screen,v);renderChips();renderSubs();const ni=$('#newSub');if(ni)ni.focus();return}
  if(e.target.id==='addForm'){e.preventDefault();const i=$('#newTask');const v=i.value.trim();if(!v)return;const p=S.projects[S.screen];
  p.tasks.push({id:'t'+uid(),title:v,status:'todo',prio:'mid',due:'',notes:'',created:Date.now()});i.value='';persist(S.screen);renderListOnly();renderChips()}});
document.addEventListener('input',e=>{
  if(e.target.id==='projName'){const pid=S.screen,p=S.projects[pid];p.name=e.target.value;const k=nodeOfProject(pid);if(k){S.map[k].text=p.name;persist('map')}persist(pid);renderChips()}
  if(e.target.id==='gsearch'){S.search=e.target.value;renderSearch();if(S.mapView==='tree')drawTree();dirty=true;startLoop()}
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='gsearch'){if(e.key==='Enter'){const h=searchHits()[0];if(h)goHit(h)}else if(e.key==='Escape'){S.search='';e.target.value='';renderSearch();redrawMap();dirty=true;startLoop()}return}
  if(e.key==='Escape'){if(S.openTask||S.openMemo){closeSheet();return}if(S.showSet){S.showSet=false;$('#gset')?.remove();return}if(S.panel&&e.target.id!=='noteBody'){S.panel=false;renderPanel();redrawMap();return}}
  if(e.target.matches&&e.target.matches('.tr[data-task]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(e.target.dataset.task);return}
  if(e.target.matches&&e.target.matches('.tb-tab')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();switchTab(e.target.dataset.tabid);return}
  if(e.target.matches&&e.target.matches('.nl-i[data-task]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(e.target.dataset.task);return}
  if(e.target.matches&&e.target.matches('.nl-i[data-memo]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openMemo(e.target.dataset.memo);return}
  if(e.target.matches&&e.target.matches('.mr[data-memo]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openMemo(e.target.dataset.memo);return}
  if(e.target.matches&&e.target.matches('tr[data-task]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(e.target.dataset.task);return}
  if(e.target.matches&&e.target.matches('tr[data-screen]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.screen=e.target.dataset.screen;render();return}
  if(e.target.matches&&e.target.matches('.nl-row[data-screen]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.screen=e.target.dataset.screen;render();return}
  if(e.target.matches&&e.target.matches('.sr[data-screen]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.screen=e.target.dataset.screen;render();return}
  if(S.screen!=='map'||S.mapView!=='tree'||S.openTask)return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea')return;
  if(e.key==='Tab'){e.preventDefault();act('child')}
  else if(e.key==='Enter'){e.preventDefault();S.sel==='root'?act('child'):act('sib')}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();act('del')}
  else if(e.key==='F2'){e.preventDefault();const i=$('#nodeText');i?.focus();i?.select()}
});

/* ---------- boot ---------- */
try{const raw=lsGet(LSK);if(raw)S.projects=JSON.parse(raw)||{};const mp=JSON.parse(lsGet(LSK+'.map')||'null');if(mp&&mp.root)S.map=mp;
  const ui=JSON.parse(lsGet(UIK)||'{}');if(Array.isArray(ui.tabs)&&ui.tabs.length){S.tabs=ui.tabs;S.tab=ui.tab}if(ui.split&&!PANE)S.split=ui.split;
  if(PANE){const hu=JSON.parse(lsGet(LSK+'.ui')||'{}');ui.skin=hu.skin;ui.v2=hu.v2;if(!ui.tabs){const q=new URLSearchParams(location.search);ui.screen=q.get('screen')||'map';ui.mapView=q.get('mv')||'graph'}}if(ui.mapView)S.mapView=ui.mapView;if(ui.gopt)Object.assign(S.gopt,ui.gopt);if(Array.isArray(ui.pcol))S.pcol=ui.pcol;if(Array.isArray(ui.ptasks))S.ptasks=ui.ptasks;if(ui.mapItems===false)S.mapItems=false;if(ui.pitems===false)S.pitems=false;if(ui.skin)S.skin=ui.skin;if(!ui.v2)S.skin='night';if(ui.screen&&(ui.screen==='map'||ui.screen==='projects'||S.projects[ui.screen]))S.screen=ui.screen}catch(e){S.projects={}}
if(!S.map)S.map=newMap();
if(!S.skin)S.skin='night';
if(S.skin&&S.skin!=='shtab'){document.documentElement.dataset.skin=S.skin;loadFonts([SKINS.find(x=>x.id===S.skin)||SKINS[0]]);updFonts();if(document.fonts)document.fonts.ready.then(refreshSkinDeps)}
migrateOld();reconcile();
ensureTabs();{const t=curTab();if(t){S.screen=t.screen;S.mapView=t.mapView}}
render();applySplit();$('#sync').textContent='Подключаю облако…';
initStore();
})();
</script>
